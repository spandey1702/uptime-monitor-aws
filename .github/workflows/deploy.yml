# On every push to main: build the image, then deploy to EC2 through SSM.
# AWS access uses the github-deploy IAM user, whose only permission is
# running a command on the app instance. Its keys live in GitHub Secrets.
# (OIDC would avoid stored keys, but it needs this account's advanced
# features, which remove the spend limits.)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button for manual redeploys

# One deploy at a time; a newer push waits for the running one
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catch a broken Dockerfile or requirements before touching the server
      - name: Build image
        run: docker build -t uptime-app:ci ./app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy.sh on EC2
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["/opt/uptime/deploy/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "SSM command $CMD_ID"

          # Poll until the command finishes (up to 10 minutes)
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent,StandardErrorContent]" --output text
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]

      # Check from outside AWS, the way a visitor reaches it
      - name: Check /health from the internet
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Strip stray whitespace or newlines a pasted variable may carry
          URL=$(printf '%s' "$APP_URL" | tr -d '[:space:]')
          echo "Checking $URL/health"
          curl -fsS --max-time 10 "$URL/health"
